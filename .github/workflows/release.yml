name: Release (.qplug)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare asset filename
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp "Luminex Gigacore.qplug" "Luminex_Gigacore_${TAG}.qplug"

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Luminex_Gigacore_${{ github.ref_name }}.qplug
