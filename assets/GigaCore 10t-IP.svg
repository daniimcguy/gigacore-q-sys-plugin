<svg xmlns="http://www.w3.org/2000/svg" width="246.5" height="35" viewBox="0 0 246.5 35">
  <!-- GigaCore 10t-IP, front view as drawn by Araneo's project mode:
       ports 1-8 (PoE ethercon, cable clip above), separator, ports 9-10
       (rear-panel ethercons, no PoE). Hand-authored for tools/parse_svg_ports.py:
       port = stroke-only circle r=8, cable clip = white 5x5 rect above it. -->
  <g id="GigaCore_10t-IP" transform="translate(0.5 0.5)">
    <rect id="chassis" width="245.5" height="34" rx="1.5" fill="none" stroke="#fff" stroke-width="1"/>
    <!-- ports 1-8 -->
    <g id="port-1"><rect x="65.5" y="2" width="5" height="5" fill="#fff"/><circle cx="68" cy="16.5" r="8" fill="none" stroke="#fff" stroke-width="1"/></g>
    <g id="port-2"><rect x="83.5" y="2" width="5" height="5" fill="#fff"/><circle cx="86" cy="16.5" r="8" fill="none" stroke="#fff" stroke-width="1"/></g>
    <g id="port-3"><rect x="101.5" y="2" width="5" height="5" fill="#fff"/><circle cx="104" cy="16.5" r="8" fill="none" stroke="#fff" stroke-width="1"/></g>
    <g id="port-4"><rect x="119.5" y="2" width="5" height="5" fill="#fff"/><circle cx="122" cy="16.5" r="8" fill="none" stroke="#fff" stroke-width="1"/></g>
    <g id="port-5"><rect x="137.5" y="2" width="5" height="5" fill="#fff"/><circle cx="140" cy="16.5" r="8" fill="none" stroke="#fff" stroke-width="1"/></g>
    <g id="port-6"><rect x="155.5" y="2" width="5" height="5" fill="#fff"/><circle cx="158" cy="16.5" r="8" fill="none" stroke="#fff" stroke-width="1"/></g>
    <g id="port-7"><rect x="173.5" y="2" width="5" height="5" fill="#fff"/><circle cx="176" cy="16.5" r="8" fill="none" stroke="#fff" stroke-width="1"/></g>
    <g id="port-8"><rect x="191.5" y="2" width="5" height="5" fill="#fff"/><circle cx="194" cy="16.5" r="8" fill="none" stroke="#fff" stroke-width="1"/></g>
    <!-- separator between front block and rear-panel block -->
    <line id="separator" x1="206" y1="0" x2="206" y2="34" fill="none" stroke="#fff" stroke-width="1"/>
    <!-- ports 9-10 (rear panel) -->
    <g id="port-9"><circle cx="217" cy="16.5" r="8" fill="none" stroke="#fff" stroke-width="1"/></g>
    <g id="port-10"><circle cx="235" cy="16.5" r="8" fill="none" stroke="#fff" stroke-width="1"/></g>
  </g>
</svg>
